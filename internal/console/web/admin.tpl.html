<!-- Meshport server console template.
     Markup and styling follow the approved console design (Admin.dc.html); app.js supplies the
     values from the live API. Bindings: {{path}}, <sc-for list as>, <sc-if value>, data-s = style,
     data-on-<event> = handler. Generated by scripts/console-template/build_tpl.py. -->
<template id="admin">
<div lang="{{langTag}}" data-s="position: relative; width: 100%; min-height: 100vh; overflow: hidden; box-sizing: border-box; font-family: {{font}}; color: {{c.text}}; background: {{c.bg}}; -webkit-font-smoothing: antialiased">
<div aria-hidden="true" data-s="position: absolute; width: 560px; height: 560px; top: -220px; right: -160px; border-radius: 50%; background: {{c.orbA}}; filter: blur(100px)"></div>
<div aria-hidden="true" data-s="position: absolute; width: 480px; height: 480px; top: 560px; left: 160px; border-radius: 50%; background: {{c.orbC}}; filter: blur(110px)"></div>

<div data-s="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh">

<aside data-s="flex: 1 1 232px; box-sizing: border-box; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 20px; background: {{c.side}}; border-right: 1px solid {{c.hair}}">
<div data-s="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<div data-s="width: 36px; height: 36px; flex: none; border-radius: 11px; background: #0E7C66; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(14, 124, 102, 0.24)">
<svg width="25" height="25" viewBox="0 0 24 24" fill="none" role="img" aria-label="Meshport logo"><path d="M5.5 19v-7.5a6.5 6.5 0 0 1 13 0V19" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><circle cx="5.5" cy="19" r="2.1" fill="#FFFFFF"></circle><circle cx="18.5" cy="19" r="2.1" fill="#FFFFFF"></circle><circle cx="12" cy="13" r="2.4" fill="#FFC24B"></circle></svg>
</div>
<div data-s="min-width: 0">
<div data-s="font-size: 18px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15">{{brand}}</div>
<div data-s="font-size: 12px; font-weight: 600; color: {{c.muted}}">{{s.consoleName}}</div>
</div>
</div>
<nav aria-label="{{s.consoleName}}" data-s="display: flex; flex-wrap: wrap; gap: 3px">
<sc-for list="{{nav}}" as="n">
<button data-on-click="{{n.go}}" aria-current="{{n.current}}" data-s="display: flex; align-items: center; gap: 12px; flex: 1 1 190px; height: 42px; padding: 0 12px; border: 0; border-radius: 12px; background: {{n.bg}}; color: {{n.fg}}; font: inherit; font-size: 14.5px; font-weight: 600; text-align: left; cursor: pointer; transition: background 0.2s">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.icon}}"></path></svg>
<span data-s="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.label}}</span>
<sc-if value="{{n.hasBadge}}">
<span data-s="min-width: 22px; height: 22px; padding: 0 7px; box-sizing: border-box; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: {{n.badgeFg}}; background: {{n.badgeBg}}">{{n.badge}}</span>
</sc-if>
</button>
</sc-for>
</nav>
<div data-s="flex: 1"></div>
<div data-s="padding: 14px; border-radius: 16px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}">
<div data-s="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">
<span data-s="width: 8px; height: 8px; border-radius: 50%; background: {{srv.dot}}; box-shadow: 0 0 0 4px {{srv.dotSoft}}"></span>
<span data-s="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{srv.name}}</span>
</div>
<div data-s="margin-top: 4px; font-size: 12.5px; color: {{c.muted}}">{{srv.state}} · {{s.uptime}} {{srv.up}}</div>
<div data-s="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; font-size: 12px; color: {{c.muted}}">
<span data-s="font-family: ui-monospace, Menlo, Consolas, monospace">{{srv.ver}}</span>
<sc-if value="{{srv.hasUpd}}"><button data-on-click="{{goSystem}}" data-s="padding: 3px 9px; border: 0; border-radius: 7px; font: inherit; font-size: 12px; font-weight: 600; color: {{c.accent}}; background: {{c.accentSoft}}; cursor: pointer">{{s.updateAvail}}</button></sc-if>
</div>
</div>
<div data-s="display: flex; gap: 8px">
<button data-on-click="{{cycleLang}}" aria-label="{{s.language}}" data-s="display: flex; flex: 1; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 14px; border: 1px solid {{c.stroke}}; background: {{c.glass}}; color: {{c.text}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M2 12h20 M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
<span>{{s.langShort}}</span>
</button>
<button data-on-click="{{toggleTheme}}" aria-label="{{s.themeToggle}}" data-s="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid {{c.stroke}}; background: {{c.glass}}; color: {{c.text}}; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{themeIcon}}"></path></svg>
</button>
<button type="button" data-on-click="{{logout}}" aria-label="{{s.logout}}" title="{{s.logout}}" data-s="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid {{c.stroke}}; background: {{c.glass}}; color: {{c.text}}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.logout}}"></path></svg></button>
</div>
</aside>

<main data-s="flex: 999 1 640px; min-width: 0; box-sizing: border-box; padding: 18px 28px 36px; display: flex; flex-direction: column; gap: 18px">

<div data-s="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div data-s="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{c.muted}}">
<span>Meshport Server</span><span aria-hidden="true">/</span><span data-s="color: {{c.text}}; font-weight: 600">{{pageTitle}}</span>
</div>
<div data-s="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<label data-s="display: flex; align-items: center; gap: 10px; width: 300px; max-width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: {{c.input}}; border: 1px solid {{c.field}}; color: {{c.faint}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.search}}"></path></svg>
<input type="text" aria-label="{{s.searchPh}}" placeholder="{{s.searchPh}}" value="{{q}}" data-on-change="{{setQ}}" data-s="flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: {{c.text}}">
</label>
<span data-s="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; height: 32px; padding: 0 12px; color: {{c.ok}}; background: {{c.okSoft}}"><span data-s="width: 7px; height: 7px; border-radius: 50%; background: currentColor"></span>{{envLabel}}</span>
<button data-on-click="{{goAlerts}}" aria-label="{{s.recentAlerts}}" data-s="position: relative; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid {{c.stroke}}; background: {{c.glass}}; color: {{c.text}}; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.bell}}"></path></svg>
<sc-if value="{{hasOpenAlerts}}"><span data-s="position: absolute; top: 7px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: {{c.critDot}}; box-shadow: 0 0 0 2px {{c.bg}}"></span></sc-if>
</button>
<button type="button" data-on-click="{{openAccount}}" aria-label="{{s.account}}" data-s="display: flex; align-items: center; gap: 10px; padding: 0 0 0 4px; border: 0; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer">
<span data-s="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: {{c.accentBg}}; color: #FFFFFF; font-size: 13px; font-weight: 700">{{me.ini}}</span>
<span data-s="line-height: 1.2"><span data-s="display: block; font-size: 13.5px; font-weight: 600">{{me.name}}</span><span data-s="display: block; font-size: 12px; color: {{c.muted}}">{{me.role}}</span></span>
</button>
</div>
</div>

<div data-s="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px">
<div>
<h1 data-s="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2">{{pageTitle}}</h1>
<p data-s="margin: 4px 0 0; font-size: 14px; color: {{c.muted}}">{{pageSub}}</p>
<sc-if value="{{hasPageErr}}"><p data-s="margin: 6px 0 0; font-size: 13px; color: {{c.crit}}">{{pageErr}}</p></sc-if>
</div>
<div data-s="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<sc-if value="{{showLive}}">
<span data-s="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; height: 32px; padding: 0 12px; color: {{c.muted}}; background: {{c.tile}}"><span data-s="width: 7px; height: 7px; border-radius: 50%; background: {{c.okDot}}; box-shadow: 0 0 0 3px {{c.okSoft}}"></span>{{s.liveEvery}}</span>
</sc-if>
<sc-if value="{{isDevices}}">
<button data-on-click="{{addDevice}}" data-s="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: {{c.accentBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px {{c.glow}}; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg><span>{{s.enrollDevice}}</span></button>
</sc-if>
<sc-if value="{{isFrp}}">
<sc-if value="{{isAdmin}}"><button type="button" data-on-click="{{addNode}}" data-s="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 40px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.server}}"></path></svg><span>{{s.addNode}}</span></button></sc-if>
<button data-on-click="{{stopAllFrp}}" data-s="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 40px; color: {{c.crit}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.stop}}"></path></svg><span>{{s.stopAllFrp}}</span></button>
<button data-on-click="{{openAddMap}}" data-s="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: {{c.accentBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px {{c.glow}}; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg><span>{{s.addMapping}}</span></button>
</sc-if>
<sc-if value="{{canGrant}}"><button type="button" data-on-click="{{grantDirect}}" data-s="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: {{c.accentBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px {{c.glow}}; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.plus}}"></path></svg><span>{{s.grantDirect}}</span></button></sc-if>
<sc-if value="{{isSecurity}}">
<button data-on-click="{{exportAudit}}" data-s="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; height: 40px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.download}}"></path></svg><span>{{s.exportAudit}}</span></button>
</sc-if>
<sc-if value="{{isMonitor}}">
<div role="group" aria-label="{{s.timeRange}}" data-s="display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: {{c.segBg}}">
<sc-for list="{{rangeSeg}}" as="o">
<button data-on-click="{{o.pick}}" aria-pressed="{{o.pressed}}" data-s="height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s">{{o.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isSystem}}">
<button data-on-click="{{checkUpdate}}" data-s="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 12px; background: {{c.accentBg}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 6px 16px {{c.glow}}; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.refresh}}"></path></svg><span>{{s.checkUpdate}}</span></button>
</sc-if>
</div>
</div>

<sc-if value="{{isOverview}}">
<div data-s="display: flex; flex-direction: column; gap: 16px">
<div data-s="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<sc-for list="{{kpis}}" as="k">
<button data-on-click="{{k.go}}" data-s="display: block; padding: 16px 18px; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%); text-align: left; font: inherit; color: {{c.text}}; cursor: pointer">
<span data-s="display: flex; align-items: center; gap: 8px; font-size: 13px; color: {{c.muted}}">
<span data-s="display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: none; border-radius: 9px; background: {{k.iconBg}}; color: {{k.iconFg}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{k.icon}}"></path></svg></span>
<span>{{k.label}}</span>
</span>
<span data-s="display: block; margin-top: 10px; font-size: 28px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{k.value}}<span data-s="font-size: 14px; font-weight: 500; color: {{c.faint}}">{{k.unit}}</span></span>
<span data-s="display: block; margin-top: 4px; font-size: 12.5px; color: {{k.subFg}}">{{k.sub}}</span>
</button>
</sc-for>
</div>

<div data-s="display: flex; flex-wrap: wrap; gap: 16px">
<section data-s="flex: 2 1 560px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">
<div data-s="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 12px">
<div>
<h2 data-s="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em">{{s.bwTitle}}</h2>
<div data-s="margin-top: 2px; font-size: 12.5px; color: {{c.muted}}">{{s.bwSub}}</div>
</div>
<div data-s="display: flex; flex-wrap: wrap; gap: 16px">
<sc-for list="{{bw.legend}}" as="lg">
<div data-s="display: flex; align-items: center; gap: 8px; font-size: 13px"><span data-s="width: 14px; height: 3px; border-radius: 2px; background: {{lg.color}}"></span><span data-s="color: {{c.muted}}">{{lg.label}}</span><span data-s="font-weight: 700; font-variant-numeric: tabular-nums">{{lg.value}}</span></div>
</sc-for>
</div>
</div>
<div data-s="padding: 0 18px 16px">
<div data-on-mouseleave="{{bw.leave}}" data-s="position: relative; height: 210px; margin: 0 78px 0 40px">
<sc-for list="{{bw.grid}}" as="gl">
<div data-s="position: absolute; left: 0; right: 0; top: {{gl.top}}%; border-top: 1px solid {{c.hair}}"></div>
<div data-s="position: absolute; left: -40px; width: 32px; top: {{gl.top}}%; transform: translateY(-50%); text-align: right; font-size: 11px; color: {{c.faint}}; font-variant-numeric: tabular-nums">{{gl.label}}</div>
</sc-for>
<svg viewBox="0 0 600 100" preserveAspectRatio="none" width="100%" height="100%" aria-hidden="true" data-s="position: absolute; inset: 0; overflow: visible">
<sc-for list="{{bw.areas}}" as="ar"><path d="{{ar.d}}" fill="{{ar.fill}}"></path></sc-for>
<sc-for list="{{bw.lines}}" as="ln"><path d="{{ln.d}}" fill="none" stroke="{{ln.color}}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"></path></sc-for>
</svg>
<sc-for list="{{bw.ends}}" as="en">
<div data-s="position: absolute; left: 100%; top: {{en.top}}%; transform: translateY(-50%); display: flex; align-items: center; gap: 5px; padding-left: 8px; font-size: 12px; font-weight: 600; color: {{c.text}}; white-space: nowrap"><span data-s="width: 8px; height: 8px; border-radius: 50%; background: {{en.color}}"></span>{{en.label}}</div>
</sc-for>
<sc-if value="{{bw.hov}}">
<div data-s="position: absolute; top: 0; bottom: 0; left: {{bw.hx}}%; border-left: 1px dashed {{c.dash}}; pointer-events: none"></div>
<sc-for list="{{bw.dots}}" as="dt">
<div data-s="position: absolute; left: {{bw.hx}}%; top: {{dt.top}}%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: {{dt.color}}; box-shadow: 0 0 0 2px {{c.bg}}; pointer-events: none"></div>
</sc-for>
</sc-if>
<sc-if value="{{bw.hov}}">
<div data-s="position: absolute; top: 0; left: {{bw.tipX}}%; transform: translateX({{bw.tipShift}}); z-index: 2; min-width: 140px; padding: 8px 10px; border-radius: 10px; background: {{c.sheet}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(20px); pointer-events: none; font-size: 12px; white-space: nowrap">
<div data-s="font-weight: 600; color: {{c.muted}}">{{bw.tipTitle}}</div>
<sc-for list="{{bw.tipRows}}" as="tr">
<div data-s="display: flex; align-items: center; gap: 6px; margin-top: 4px"><span data-s="width: 8px; height: 8px; border-radius: 50%; background: {{tr.color}}"></span><span data-s="flex: 1; color: {{c.text}}">{{tr.label}}</span><span data-s="margin-left: 8px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{c.text}}">{{tr.value}}</span></div>
</sc-for>
</div>
</sc-if>
<div data-s="position: absolute; inset: 0; display: flex">
<sc-for list="{{bw.cols}}" as="hc"><div data-on-mouseenter="{{hc.enter}}" data-s="flex: 1; height: 100%"></div></sc-for>
</div>
</div>
<div aria-hidden="true" data-s="display: flex; justify-content: space-between; margin: 8px 78px 0 40px; font-size: 11px; color: {{c.faint}}">
<sc-for list="{{bw.xl}}" as="xl"><span>{{xl.t}}</span></sc-for>
</div>
</div>
</section>

<section data-s="flex: 1 1 320px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">
<div data-s="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 12px">
<h2 data-s="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em">{{s.resTitle}}</h2>
<div role="group" aria-label="{{s.resTitle}}" data-s="display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; border-radius: 12px; background: {{c.segBg}}">
<sc-for list="{{resSeg}}" as="o">
<button data-on-click="{{o.pick}}" aria-pressed="{{o.pressed}}" data-s="height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s">{{o.label}}</button>
</sc-for>
</div>
</div>
<div data-s="display: flex; flex-direction: column; gap: 14px; padding: 2px 18px 16px">
<sc-for list="{{res}}" as="r">
<div>
<div data-s="display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13.5px">
<span data-s="font-weight: 600">{{r.label}}</span>

<section data-s="flex: 1 1 340px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">

<span data-s="display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.title}}</span>

</sc-for>
</section>
</div>
</div>

<sc-if value="{{isSystem}}">

<section data-s="flex: 1 1 340px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">

</div>

</div>

<div data-s="display: flex; flex-wrap: wrap; gap: 16px">

<span data-s="display: flex; justify-content: flex-end"><span data-s="display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; color: {{v.fg}}; background: {{v.bg}}">{{v.label}}</span></span>
</div>

<section data-s="flex: 1 1 420px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">

</div>

</div>

<div data-s="display: flex; flex-wrap: wrap; gap: 16px">

<span data-s="color: {{c.muted}}; flex: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.link}}"></path></svg></span>

</span>

</div>
</sc-for>
</section>
<section data-s="flex: 1 1 460px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">

<span data-s="display: block; margin-top: 3px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; color: {{c.muted}}">{{k.key}} · {{k.created}}</span>
</span>
<button data-on-click="{{k.copy}}" aria-label="{{s.copy}} {{k.name}}" data-s="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; width: 34px; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.copy}}"></path></svg></button>

</div>
</sc-for>
</section>
</div>

<div data-s="display: flex; flex-wrap: wrap; gap: 16px">

<div data-s="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px 12px"><h2 data-s="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em">{{s.apiDocs}}</h2><button data-on-click="{{openDocs}}" data-s="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 6px; border: 0; border-radius: 8px; background: transparent; color: {{c.accent}}; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.book}}"></path></svg> OpenAPI 3.1</button></div>

</div>

</div>

<section data-s="flex: 1 1 460px; min-width: 0; border-radius: 20px; background: {{c.glass}}; border: 1px solid {{c.stroke}}; box-shadow: {{c.shadow}}; backdrop-filter: blur(24px) saturate(170%)">

<div data-s="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; color: {{c.muted}}"><span>{{r.label}}</span>
<div data-s="display: flex; gap: 8px"><div data-s="flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; background: {{c.tile}}; color: {{c.text}}; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; word-break: break-all">{{r.value}}</div>
<button type="button" data-on-click="{{r.copy}}" aria-label="{{s.copy}} {{r.label}}" data-s="display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex: none; border-radius: 10px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{I.copy}}"></path></svg></button></div></div>
</sc-for>
<sc-if value="{{au.hasErr}}"><div role="alert" data-s="font-size: 13px; color: {{c.crit}}">{{au.err}}</div></sc-if>
<div data-s="padding: 12px 14px; border-radius: 14px; background: {{c.accentSoft}}; font-size: 12.5px; color: {{c.muted}}; line-height: 1.6">{{s.enrollHint}}</div>
<a href="/" data-s="display: flex; align-items: center; justify-content: center; height: 42px; border-radius: 12px; border: 1px solid {{c.field}}; background: {{c.input}}; color: {{c.text}}; font-size: 14px; font-weight: 600; text-decoration: none">{{s.toConsole}}</a>
</div>
</sc-if>
</div>
<sc-if value="{{hasToast}}">
<div role="status" data-s="position: fixed; left: 50%; top: 20px; z-index: 50; transform: translateX(-50%); width: max-content; max-width: 420px; padding: 10px 18px; border-radius: 16px; background: {{c.toastBg}}; color: {{c.toastFg}}; font-size: 14px; font-weight: 500; text-align: center; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22)">{{toast}}</div>
</sc-if>
</div>
</template>
