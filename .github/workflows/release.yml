name: Release

# Push a tag like v1.1.0 to build and publish a GitHub Release with:
#   - server:  meshport-server-<v>-linux-{amd64,arm64}.tar.gz
#   - desktop: meshport-desktop-<v>-{linux-amd64,linux-arm64}.tar.gz, -{windows-amd64,windows-arm64}.zip
#   - android: meshport-android-<v>-{universal,arm64-v8a,armeabi-v7a,x86_64}.apk
# Run it manually (Actions -> Release -> Run workflow) to get the same files
# as a draft release.
#
# Optional secrets for a stable Android signing key (otherwise the APK is
# signed with a throwaway debug key and cannot be upgraded in place):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.1.0 (default 0.0.0-dev.<run number>)'
        required: false

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      fileversion: ${{ steps.v.outputs.fileversion }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="$INPUT_VERSION"; fi
          [ -n "$v" ] || v="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          case "$v" in *[!A-Za-z0-9._-]*) echo "invalid version: $v"; exit 1;; esac
          fv=$(echo "$v" | sed -nE 's/^([0-9]+)\.([0-9]+)\.([0-9]+).*/\1.\2.\3.0/p')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "fileversion=${fv:-0.0.0.0}" >> "$GITHUB_OUTPUT"

  server:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build server packages
        run: make release VERSION=${{ needs.meta.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: release/*.tar.gz
          if-no-files-found: error

  desktop:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Windows resources (icon, version info, DPI manifest)
        continue-on-error: true
        working-directory: cmd/meshport
        env:
          V: ${{ needs.meta.outputs.version }}
          FV: ${{ needs.meta.outputs.fileversion }}
        run: |
          go install github.com/tc-hib/go-winres@v0.3.3
          go-winres simply --arch amd64,arm64 --icon ../../packaging/icons/meshport.png --manifest gui \
            --product-name Meshport --file-description "Meshport desktop client" \
            --product-version "$V" --file-version "$FV"
          ls -la *.syso
      - name: Build Linux and Windows packages
        run: make desktop VERSION=${{ needs.meta.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            release/*.tar.gz
            release/*.zip
          if-no-files-found: error

  android:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "using NDK $NDK"
      - name: Build Go core (gomobile AAR)
        run: |
          MV=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$MV golang.org/x/mobile/cmd/gobind@$MV
          gomobile init
          gomobile bind -v -trimpath -ldflags "-s -w" -target=android/arm64,android/arm,android/amd64 -androidapi 24 \
            -o android/app/libs/meshcore.aar ./mobile/meshcore
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with a debug key."
          fi
      - name: Build APKs
        working-directory: android
        env:
          VERSION_NAME: ${{ needs.meta.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Collect APKs
        env:
          V: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/release/*.apk; do
            b=$(basename "$f" .apk); abi=${b#app-}; abi=${abi%-release}
            cp "$f" "out/meshport-android-$V-$abi.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          if-no-files-found: error

  publish:
    needs: [meta, server, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', needs.meta.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: Meshport ${{ needs.meta.outputs.version }}
          draft: ${{ github.ref_type != 'tag' }}
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          generate_release_notes: true
          files: dist/*
