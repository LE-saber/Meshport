# coturn configuration for Meshport (Ubuntu: /etc/turnserver.conf)
# meshportd hands out short-lived TURN REST credentials signed with the
# shared secret below (turn.secret in /etc/meshport/meshport.yaml).

listening-port=3478
tls-listening-port=5349
# relay port range; open it in the firewall (UDP)
min-port=49160
max-port=49200

fingerprint
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=__REALM__

# If the server is behind 1:1 NAT (cloud VMs), set the public address:
# external-ip=PUBLIC_IP/PRIVATE_IP

# TLS for turns: (optional, reuse the console certificate)
# cert=/etc/letsencrypt/live/__REALM__/fullchain.pem
# pkey=/etc/letsencrypt/live/__REALM__/privkey.pem

no-cli
no-multicast-peers
# never relay to private ranges (prevents using TURN to reach the LAN of the server)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff

total-quota=200
stale-nonce=600
log-file=syslog
simple-log
